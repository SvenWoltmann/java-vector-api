version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  # Maven plugins of the examples
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
  # JMH and the Maven plugins of the benchmarks
  - package-ecosystem: "maven"
    directory: "/benchmarks"
    schedule:
      interval: "daily"
