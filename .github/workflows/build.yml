name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # SonarQube Cloud removes tokens unused for 60 days, and Dependabot
    # builds skip the Sonar step, so a quiet repository loses its token.
    # A monthly run keeps it in use.
    - cron: '23 4 5 * *'

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # The Vector API is the incubator module jdk.incubator.vector;
      # the examples and measurements of the article use Java 27.
      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '27'
          cache: 'maven'

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Verify code format
        run: mvn -B spotless:check

      - name: Build
        run: mvn -B verify

      # Fails if a program ends with an exception. The outputs depend on the
      # CPU of the runner, so they are only shown, not compared.
      - name: Run all examples
        run: |
          scripts/run-examples.sh "$JAVA_HOME" github-actions
          tail -n +1 results/github-actions/*/*.txt >> "$GITHUB_STEP_SUMMARY"

      # Compiles the benchmarks; running them needs an idle machine
      - name: Compile the benchmarks
        run: mvn -B -f benchmarks/pom.xml package

      - name: Analyze code with Sonar
        if: ${{ env.SONAR_TOKEN }} # the token is not available in Dependabot-triggered builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
