name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The Vector API is the incubator module jdk.incubator.vector;
      # the examples and measurements of the article use Java 27.
      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '27'
          cache: 'maven'

      - name: Build
        run: mvn -B verify

      # Fails if a program ends with an exception. The outputs depend on the
      # CPU of the runner, so they are only shown, not compared.
      - name: Run all examples
        run: |
          scripts/run-examples.sh "$JAVA_HOME" github-actions
          tail -n +1 results/github-actions/*/*.txt >> "$GITHUB_STEP_SUMMARY"

      # Compiles the benchmarks; running them needs an idle machine
      - name: Compile the benchmarks
        run: mvn -B -f benchmarks/pom.xml package
